name: Pull Request Verification

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Run Verification Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify OpenAPI Client Generation
        run: |
          npm run generate
          git diff --exit-code || { echo "ERROR: API client or Zod validation schemas are out of sync with the OpenAPI specification. Please run 'npm run generate' locally and commit the changes."; exit 1; }

      - name: Run linter
        run: npm run lint

      - name: Build backend server
        run: npm run build --workspace=server

      - name: Build frontend app (Expo Web)
        run: npm run build --workspace=mathematador-app

      - name: Run unit tests
        run: npm test
