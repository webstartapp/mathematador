name: Deploy Production

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate server secrets
        run: |
          [ -n "${{ secrets.DEPLOY_PATH }}" ]        || { echo "ERROR: DEPLOY_PATH is not set"; exit 1; }
          [ -n "${{ secrets.SERVER_USER }}" ]         || { echo "ERROR: SERVER_USER is not set"; exit 1; }
          [ -n "${{ secrets.SERVER_HOST }}" ]         || { echo "ERROR: SERVER_HOST is not set"; exit 1; }
          [ -n "${{ secrets.SERVER_PASSWORD }}" ]     || { echo "ERROR: SERVER_PASSWORD is not set"; exit 1; }
          [ -n "${{ secrets.SERVER_ENV_FILE }}" ]     || { echo "ERROR: SERVER_ENV_FILE is not set"; exit 1; }
          [ -n "${{ secrets.GUI_ENV_FILE }}" ]        || { echo "ERROR: GUI_ENV_FILE is not set"; exit 1; }
          [ -n "${{ secrets.PM2_APP_NAME }}" ]        || { echo "ERROR: PM2_APP_NAME is not set"; exit 1; }
          echo "All required secrets are set"

      - name: Install zip and sshpass
        run: sudo apt-get update && sudo apt-get install -y zip sshpass

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Build server
        run: npm run build --workspace=server


      - name: Build app (Expo Web)
        run: npm run build --workspace=mathematador-app

      - name: Prepare stage folder
        run: |
          mkdir -p stage/web
          mkdir -p stage/server

          # Copy Expo Web build
          cp -r mathematador-app/dist/. stage/web/

          # Copy Server build & runtime config
          cp -r server/build/. stage/server/build/
          cp server/package.json stage/server/
          cp server/knexfile.js stage/server/
          cp -r server/src stage/server/src

      - name: Zip stage folder
        run: cd stage && zip -r ../deploy.zip .

      - name: Prepare remote folders
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -se << 'ENDSSH'
            set -e
            mkdir -p "${{ secrets.DEPLOY_PATH }}/web"
            mkdir -p "${{ secrets.DEPLOY_PATH }}/server"
          ENDSSH

      - name: Transfer zip to server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no ./deploy.zip \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_PATH }}/deploy.zip

      - name: Unzip deployment on server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -se << 'ENDSSH'
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            unzip -o deploy.zip
            rm deploy.zip
          ENDSSH

      - name: Copy environment files on server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -se << 'ENDSSH'
            set -e
            cp "${{ secrets.SERVER_ENV_FILE }}" "${{ secrets.DEPLOY_PATH }}/server/.env"
            cp "${{ secrets.GUI_ENV_FILE }}" "${{ secrets.DEPLOY_PATH }}/web/.env"
            echo "Server and GUI .env files copied"
          ENDSSH

      - name: Install server production dependencies
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -se << 'ENDSSH'
            set -e
            cd "${{ secrets.DEPLOY_PATH }}/server"
            npm install --omit=dev
          ENDSSH

      - name: Run Knex migrations
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -se << 'ENDSSH'
            set -e
            cd "${{ secrets.DEPLOY_PATH }}/server"
            npx knex migrate:latest
          ENDSSH

      - name: Restart or Start server under PM2
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -se << 'ENDSSH'
            set -e
            if pm2 describe ${{ secrets.PM2_APP_NAME }} > /dev/null 2>&1; then
              echo "PM2 process is running, restarting..."
              pm2 restart ${{ secrets.PM2_APP_NAME }} --update-env
            else
              echo "PM2 process is not running, starting..."
              cd "${{ secrets.DEPLOY_PATH }}/server"
              pm2 start build/index.js --name ${{ secrets.PM2_APP_NAME }}
            fi
          ENDSSH

      - name: Restart or Start GUI under PM2
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -se << 'ENDSSH'
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            GUI_APP_NAME="${{ secrets.PM2_APP_NAME }}-gui"
            if pm2 describe "$GUI_APP_NAME" > /dev/null 2>&1; then
              echo "PM2 GUI process is running, restarting..."
              pm2 restart "$GUI_APP_NAME" --update-env
            else
              echo "PM2 GUI process is not running, starting..."
              pm2 start "npx --yes serve -s web -l 4075" --name "$GUI_APP_NAME"
            fi
          ENDSSH
