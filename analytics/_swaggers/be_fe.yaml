openapi: 3.0.0
servers: []
info:
  version: 0.0.1
  title: Cyberspace-api
  description: Hybrid game api to access databases
  contact: 
    email: limbaceha@gmail.com
    name: Karel Bohac
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
paths: 
  /user/forgotten:
    post:
      operationId: user_forgotten
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/CredentialsEmail'
      responses:
        '201':
          description: User found
  /user/login:
    post: 
      operationId: user_login
      summary: check the credentials and login
      requestBody: 
        required: true
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    put: 
      operationId: user_login_password
      summary: submit new password after forgotten
      requestBody: 
        required: true
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/CredentialsPassword'
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
  /user/register:
    post:
      operationId: user_register
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          $ref: '#/components/schemas/UserProfile'
  /user/forgotten-password:
    post:
      operationId: user_forgotten_password
      summary: Send forgotten password email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsEmail'
      responses:
        '201':
          description: Email sent
  /challenges/{operationId}:
    parameters:
      - $ref: '#/components/parameters/OperationId'
    post:
      operationId: challenge_start_new
      summary: Create a new game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: Game Object
    get:
      operationId: challenge_get_all
      summary: Get all user challenges
      responses:
        '200':
          description: List of challenges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Challenge'
  /challenges/{operationId}/{id}:
    parameters:
      - $ref: '#/components/parameters/OperationId'
      - $ref: '#/components/parameters/Id'
    get:
      operationId: challenge_get
      summary: Get challenge by id
      responses:
        '200':
          description: Detail of challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
    put:
      operationId: challenge_update_result
      summary: Update challenge items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeResultRequest'
      responses:
        '200':
          description: Challenge updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameProgress'
  /subscriptions:
    post:
      operationId: subscription_update
      summary: Add new subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreate'
      responses:
        '200':
          description: subscription added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
    delete:
      operationId: subscription_cancel_immediately
      summary: Remove subscription
      responses:
        '200':
          description: subscription removed
  /game/progress:
    get:
      operationId: game_progress
      summary: Get game status 
      responses:
        '200':
          description: Game status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameProgress'
  /cosmetics:
    get:
      operationId: cosmetics_get_all
      summary: Retrieve all available cosmetics in the shop
      responses:
        '200':
          description: List of cosmetics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cosmetic'
  /user/cosmetics/buy:
    post:
      operationId: cosmetics_buy
      summary: Buy a cosmetic item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cosmeticId:
                  $ref: '#/components/schemas/Id'
              required:
                - cosmeticId
      responses:
        '200':
          description: Purchase successful, returns updated progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameProgress'
  /user/cosmetics/equip:
    post:
      operationId: cosmetics_equip
      summary: Equip or unequip a cosmetic item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cosmeticId:
                  $ref: '#/components/schemas/Id'
                equipped:
                  type: boolean
              required:
                - cosmeticId
                - equipped
      responses:
        '200':
          description: Equip status updated, returns updated progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameProgress'
components:
  parameters:
    OperationId:
      name: operationId
      in: path
      required: true
      description: Operation to filter by
      schema:
        type: string
        enum:
          - addition
          - subtraction
          - multiplication
          - division
          - gauntlet
          - daily_challenge
    Id:
      name: id
      in: path
      required: true
      description: Unique identifier of a challenge session or user
      schema:
        type: string
        format: uuid
  schemas:
    Id:
      type: string
      format: uuid
    OperationId:
      type: string
      enum:
        - addition
        - subtraction
        - multiplication
        - division
        - gauntlet
        - daily_challenge
    ChallengeRequest:
      type: object
      properties:
        operationId:
          $ref: '#/components/schemas/OperationId'
        minigame:
          $ref: '#/components/schemas/Minigame'
        userId:
          $ref: '#/components/schemas/Id'
        challengeId:
          $ref: '#/components/schemas/Id'
    EquationType:
      type: string
      enum:
        - entry
        - result
        - operator
    Exercise:
      type: object
      properties:
        values:
          type: array
          items:
            type: number
        result:
          type: number
        separator:
          type: string
        userInput:
          type: string
    ChallengeResultRequest:
      type: object
      properties:
        time: 
          type: number
        results:
          type: array
          items:
            $ref: '#/components/schemas/Exercise'
        correctAnswers:
          type: number
        coins:
          type: number
        xp: 
          type: number
    Challenge:
      type: object
      allOf:
        - $ref: '#/components/schemas/ChallengeRequest'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/ChallengeResultRequest'
            id:
              $ref: '#/components/schemas/Id'
            exercises:
              type: array
              items:
                $ref: '#/components/schemas/Exercise'
            maxTime:
              type: number
            xpOnSuccess:
              type: number
            xpOnFailure:
              type: number
            coinsOnSuccess:
              type: number
            coinsOnFailure:
              type: number
            coins:
              type: number
            allowedMistakes:
              type: number
    GameProgress:
      type: object
      properties:
        level:
          type: number
        xp:
          type: number
        coins:
          type: number
        operations:
          type: array
          items:
            $ref: '#/components/schemas/GameOperationProgress'
        purchasedCosmetics:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        equippedCape:
          $ref: '#/components/schemas/Id'
          nullable: true
        equippedSuit:
          $ref: '#/components/schemas/Id'
          nullable: true
        equippedFlare:
          $ref: '#/components/schemas/Id'
          nullable: true
        minigameProgress:
          type: array
          items:
            $ref: '#/components/schemas/MinigameProgress'
    GameOperationProgress: 
      type: object
      properties:
        level:
          type: number
        xp:
          type: number
        challenges:
          type: array
          items:
            $ref: '#/components/schemas/Challenge'
    Minigame:
      type: string
      enum:
        - singleLine
        - dragAndDrop
        - crossNumbers
        - memory
    CredentialsEmail:
      type: object
      properties:
        email:
          type: string
          format: email
    CredentialsPassword:
      type: object
      properties:
        password:
          type: string
    ForgottenToken:
      type: object
      properties:
        tokenForgotten:
          type: string
    Credentials:
      type: object
      allOf:
        - $ref: '#/components/schemas/CredentialsEmail'
        - $ref: '#/components/schemas/CredentialsPassword'
      required:
        - email
        - password
    ForgottenCredentials:
      type: object
      allOf:
        - $ref: '#/components/schemas/CredentialsPassword'
        - $ref: '#/components/schemas/ForgottenToken'
      required:
        - password
        - tokenForgotten
    SubscriptionType:
      type: string
      enum:
        - addsFree
        - full
    SubscriptionCreate:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SubscriptionType'
        autoRenew:
          type: boolean
    Subscription:
      type: object
      allOf:
        - $ref: '#/components/schemas/SubscriptionCreate'
        - type: object
          properties:
            id:
              $ref: '#/components/schemas/Id'
            type:
              $ref: '#/components/schemas/SubscriptionType'
            autoRenew:
              type: boolean
    UserProfile:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        subscription:
          $ref: '#/components/schemas/Subscription'
    Cosmetic:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        type:
          type: string
          enum:
            - cape
            - suit
            - flare
        price:
          type: number
        assetId:
          type: string
        requiredLevel:
          type: number
    MinigameProgress:
      type: object
      properties:
        minigameId:
          $ref: '#/components/schemas/Minigame'
        level:
          type: number
        xp:
          type: number